upstream user_service    { server host.docker.internal:8001; }
upstream wallet_service  { server host.docker.internal:8002; }
upstream booking_service { server host.docker.internal:8003; }
upstream orchestrator    { server host.docker.internal:8007; }

server {
    listen 80;

    # Auth + users
    location ~ ^/v1/(auth|me) {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Users PATCH /v1/users/me
    location /v1/users/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Wallet
    location /v1/wallet {
        proxy_pass http://wallet_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Routes + Bookings
    location ~ ^/v1/(routes|bookings) {
        proxy_pass http://booking_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Agent logs (orchestrator)
    location /v1/agent/ {
        proxy_pass http://orchestrator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
