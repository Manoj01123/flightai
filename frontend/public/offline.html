<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlightAI — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    .icon {
      width: 72px; height: 72px;
      background: #eff6ff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 10px; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 28px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fef3c7; color: #92400e;
      border-radius: 999px; padding: 6px 16px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 28px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
    button {
      background: #2563eb; color: white;
      border: none; cursor: pointer;
      padding: 12px 28px; border-radius: 12px;
      font-size: 14px; font-weight: 600;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
    .footer { margin-top: 20px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✈️</div>
    <h1>You're offline</h1>
    <div class="status"><div class="dot"></div>No internet connection</div>
    <p>FlightAI needs a connection to show your routes and bookings. Your AI agent is still running in the cloud — it will keep watching for deals.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="footer">FlightAI — powered by Gemini AI</div>
  </div>
</body>
</html>
